name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version assertion; must match the selected release tag'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Verify immutable release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Invalid release version'
          assert os.environ['GITHUB_REF'] == f'refs/tags/v{version}', 'Publication requires the matching immutable release tag'
          assert os.environ.get('REQUESTED_VERSION', '') in ('', version), 'Input/version mismatch'
          for filename, pattern in [
              ('setup.py', r'version="([^"]+)"'),
              ('miso_client/__init__.py', r'__version__ = "([^"]+)"'),
              ('.bumpversion.cfg', r'current_version = (\S+)'),
              ('CHANGELOG.md', r'## \[(\d+\.\d+\.\d+)\]'),
          ]:
              assert re.search(pattern, Path(filename).read_text()).group(1) == version, filename
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Check PyPI availability
        id: pypi
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl --retry 3 --max-time 30 -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/miso-client/$VERSION/json")
          case "$status" in
            200) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected PyPI response: $status"; exit 1 ;;
          esac
      - name: Install build and validation dependencies
        if: steps.pypi.outputs.exists == 'false'
        run: |
          python3 -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt -r requirements-test.txt build twine
      - name: Validate release
        if: steps.pypi.outputs.exists == 'false'
        run: |
          venv/bin/python -m basedpyright
          timeout --signal=TERM --kill-after=10s 180s venv/bin/python -m pytest tests/unit/ -q -o faulthandler_timeout=45
      - name: Build and check distributions
        if: steps.pypi.outputs.exists == 'false'
        run: |
          venv/bin/python -m build
          venv/bin/python -m twine check dist/*
      - name: Publish distributions
        if: steps.pypi.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: venv/bin/python -m twine upload --non-interactive dist/*
      - name: Verify publication
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ALREADY_EXISTS: ${{ steps.pypi.outputs.exists }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --retry 2 --max-time 30 -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/miso-client/$VERSION/json")
            if [ "$status" = 200 ]; then
              if [ "$ALREADY_EXISTS" = true ]; then
                echo "Verified existing miso-client==$VERSION; upload skipped."
              else
                echo "Verified publication of miso-client==$VERSION."
              fi
              exit 0
            fi
            sleep 10
          done
          echo 'Publication could not be verified.'
          exit 1
