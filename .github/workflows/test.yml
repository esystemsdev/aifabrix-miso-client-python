name: Test

on:
  push:
    branches: [ main, dev, "release/miso-client-python-*" ]
  pull_request:
    branches: [ main, dev, "release/miso-client-python-*" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
    
    - name: Install dependencies
      run: |
        python3 -m venv venv
        venv/bin/python3 -m pip install --upgrade pip
        venv/bin/python3 -m pip install -r requirements.txt
        venv/bin/python3 -m pip install -r requirements-test.txt

    - name: Run basedpyright
      run: |
        venv/bin/python3 -m basedpyright
    
    - name: Run tests
      run: |
        timeout --signal=TERM --kill-after=10s 180s venv/bin/python3 -m pytest tests/unit/ -v -o faulthandler_timeout=45
