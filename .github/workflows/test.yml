name: Test

on:
  push:
    branches: [ main, dev, "release/miso-client-python-*" ]
  pull_request:
    branches: [ main, dev, "release/miso-client-python-*" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements/*.lock
          requirements/*.in

    - uses: pnpm/action-setup@v4
      with:
        version: 12.11.2
        run_install: false

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install locked development environment
      run: make PYTHON=python3 VENV=venv install-dev

    - name: Install frozen platform checker tools
      run: make NODE=node PNPM=pnpm install-node-tools

    - name: Run required validation chain
      run: |
        make PYTHON=python3 VENV=venv format-silent
        make PYTHON=python3 VENV=venv lint-silent
        make PYTHON=python3 VENV=venv basedpyright-silent
        make PYTHON=python3 VENV=venv type-check-silent
        timeout --signal=TERM --kill-after=10s 180s make PYTHON=python3 VENV=venv test-silent
        make NODE=node platform-baseline-check-silent

  python-next-readiness:
    name: Python 3.15 readiness (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.15"
        cache: pip
        cache-dependency-path: |
          requirements/*.lock
          requirements/*.in

    - uses: pnpm/action-setup@v4
      with:
        version: 12.11.2
        run_install: false

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install committed locked development environment
      run: make PYTHON=python3 VENV=venv install-dev

    - name: Install frozen platform checker tools
      run: make NODE=node PNPM=pnpm install-node-tools

    - name: Run readiness validation chain
      run: |
        make PYTHON=python3 VENV=venv format-silent
        make PYTHON=python3 VENV=venv lint-silent
        make PYTHON=python3 VENV=venv basedpyright-silent
        make PYTHON=python3 VENV=venv type-check-silent
        timeout --signal=TERM --kill-after=10s 180s make PYTHON=python3 VENV=venv test-silent
        make NODE=node platform-baseline-check-silent
